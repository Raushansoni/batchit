name: Release APK

on:
  push:
    branches: [ main ]
    paths:
      - buildSrc/src/main/kotlin/Configurations.kt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set; using placeholder for CI compile."
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Read version from Configurations.kt
        id: ver
        run: |
          FILE=buildSrc/src/main/kotlin/Configurations.kt
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE")
          MAJOR=$(grep -oP 'majorVersion\s*=\s*\K[0-9]+' "$FILE")
          MINOR=$(grep -oP 'minorVersion\s*=\s*\K[0-9]+' "$FILE")
          PATCH=$(grep -oP 'patchVersion\s*=\s*\K[0-9]+' "$FILE")
          NAME="${MAJOR}.${MINOR}.${PATCH}"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version $NAME ($CODE)"

      - name: Ensure version has not already been released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionCode and versionName before pushing to main."
            exit 1
          fi

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/batchit-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release artifacts
        id: artifacts
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          DEST="dist/batchit-${{ steps.ver.outputs.version_name }}-${{ steps.ver.outputs.version_code }}.apk"
          cp "$SRC" "$DEST"
          TAG="v${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}"
          ASSET="$(basename "$DEST")"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          cat > dist/app_update.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.version_code }},
            "versionName": "${{ steps.ver.outputs.version_name }}",
            "apkUrl": "${URL}",
            "forceUpdate": false,
            "notes": "BatchIt ${{ steps.ver.outputs.version_name }}"
          }
          EOF
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"
          cat dist/app_update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}
          name: BatchIt ${{ steps.ver.outputs.version_name }} (${{ steps.ver.outputs.version_code }})
          body: |
            Automatic build from `main`.

            - versionName: ${{ steps.ver.outputs.version_name }}
            - versionCode: ${{ steps.ver.outputs.version_code }}
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            dist/app_update.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Firestore config/app_update
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          APK_URL: ${{ steps.artifacts.outputs.apk_url }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Skipping Firestore write — add repo secret FIREBASE_SERVICE_ACCOUNT to enable."
            echo "Without this secret, old app builds that only read Firestore will not see this release."
            exit 0
          fi
          npm install --silent firebase-admin@12
          node <<'NODE'
          const admin = require('firebase-admin');
          let sa;
          try {
            sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          } catch (err) {
            console.error('FIREBASE_SERVICE_ACCOUNT is set but is not valid JSON:', err.message);
            process.exit(1);
          }
          admin.initializeApp({ credential: admin.credential.cert(sa) });
          const payload = {
            versionCode: Number(process.env.VERSION_CODE),
            versionName: process.env.VERSION_NAME,
            apkUrl: process.env.APK_URL,
            forceUpdate: false,
            notes: `BatchIt ${process.env.VERSION_NAME}`,
            updatedAt: admin.firestore.FieldValue.serverTimestamp(),
          };
          if (!Number.isFinite(payload.versionCode) || payload.versionCode <= 0) {
            console.error('Invalid versionCode in Firestore payload:', payload.versionCode);
            process.exit(1);
          }
          if (!payload.apkUrl) {
            console.error('Missing apkUrl in Firestore payload');
            process.exit(1);
          }
          admin.firestore().doc('config/app_update').set(payload, { merge: true })
            .then(() => {
              console.log('Wrote config/app_update', JSON.stringify(payload, null, 2));
              process.exit(0);
            })
            .catch((err) => {
              console.error('Failed to write config/app_update:', err);
              process.exit(1);
            });
          NODE
